<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./public/logo.png" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cross Origin -->
    <meta name="cross-origin-opener-policy" content="unsafe-none" />

    <!-- Primary SEO -->
    <title>
      Aurevian Collections | Buy Premium Jewellery, Watches & Accessories Online
      India
    </title>
    <meta
      name="description"
      content="Shop premium jewellery, watches, sunglasses & perfumes at Aurevian Collections. Elegant designs, fast delivery across India. Order online today!"
    />
    <meta
      name="keywords"
      content="Aurevian Collections, jewellery online India, fashion accessories, watches, sunglasses, perfumes, women's jewellery, men's accessories, online jewellery store, buy jewellery online"
    />
    <meta name="author" content="Aurevian Collections" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.aureviancollections.in/" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="dns-prefetch" href="https://www.aureviancollections.in" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Aurevian Collections | Premium Jewellery & Fashion Accessories"
    />
    <meta
      property="og:description"
      content="Discover elegant jewellery, watches, sunglasses and perfumes at Aurevian Collections. Shop stylish collections with fast delivery across India."
    />
    <meta property="og:url" content="https://www.aureviancollections.in/" />
    <meta
      property="og:image"
      content="https://www.aureviancollections.in/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Aurevian Collections" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Aurevian Collections | Premium Jewellery & Fashion Accessories"
    />
    <meta
      name="twitter:description"
      content="Shop elegant jewellery, watches, sunglasses & perfumes online. Fast delivery across India."
    />
    <meta
      name="twitter:image"
      content="https://www.aureviancollections.in/og-image.jpg"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#b3873f" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Aurevian Collections",
        "url": "https://www.aureviancollections.in",
        "logo": "https://www.aureviancollections.in/titlelogo.png",
        "sameAs": ["https://www.instagram.com/aureviancollections"]
      }
    </script>

    <!-- Structured Data: Website + Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Aurevian Collections",
        "url": "https://www.aureviancollections.in",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.aureviancollections.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
